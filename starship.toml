"$schema" = 'https://starship.rs/config-schema.json'

# Don't add a blank line between shell prompts
add_newline = false

format = """
$username$hostname:$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$docker_context\
$sudo \
$line_break\
$status\
$container\
$shell\
$character"""

[character]
success_symbol = "❯"

[directory]
truncation_length = 100
#truncation_symbol = "…/"

[docker_context]
format = '\[[$symbol$context]($style)\]'

[fossil_branch]
format = '\[[$symbol$branch]($style)\]'

[git_branch]
format = '\[[$symbol$branch]($style)\]'

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'

[hg_branch]
format = '\[[$symbol$branch]($style)\]'

[hostname]
format = "[@$hostname]($style)"
style = 'bold green'
ssh_only = false

[sudo]
format = '\[[as $symbol]($style)\]'

[username]
format = '[$user]($style)'
style_user = 'bold green'
show_always = true


